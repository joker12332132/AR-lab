<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hand Tracking AR</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video, canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* заполняет экран без искажений, обрезая лишнее */
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
</head>
<body>

<div class="container">
  <video class="input_video" style="display:none;" playsinline></video>
  <canvas class="output_canvas"></canvas>
</div>

<script>
const videoElement = document.getElementsByClassName('input_video')[0];
const canvasElement = document.getElementsByClassName('output_canvas')[0];
const canvasCtx = canvasElement.getContext('2d');

// Подгоняем размер canvas под реальный размер экрана
function resizeCanvas() {
  canvasElement.width = window.innerWidth;
  canvasElement.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const fingerColors = {
  thumb:  '#FFD700',
  index:  '#00FF7F',
  middle: '#1E90FF',
  ring:   '#FF4500',
  pinky:  '#FF00FF'
};

const fingerIndices = {
  thumb:  [1,2,3,4],
  index:  [5,6,7,8],
  middle: [9,10,11,12],
  ring:   [13,14,15,16],
  pinky:  [17,18,19,20]
};

function onResults(results) {
  canvasCtx.save();
  canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

  // Рисуем видео с камеры на весь canvas (растягиваем под экран)
  canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

  if (results.multiHandLandmarks) {
    for (const landmarks of results.multiHandLandmarks) {

      drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS,
        { color: '#FFFFFF80', lineWidth: 3 });

      for (const finger in fingerIndices) {
        for (const idx of fingerIndices[finger]) {
          const point = landmarks[idx];
          canvasCtx.beginPath();
          canvasCtx.arc(point.x * canvasElement.width,
                         point.y * canvasElement.height,
                         8, 0, 2 * Math.PI);
          canvasCtx.fillStyle = fingerColors[finger];
          canvasCtx.fill();
        }
      }

      const wrist = landmarks[0];
      canvasCtx.beginPath();
      canvasCtx.arc(wrist.x * canvasElement.width, wrist.y * canvasElement.height, 8, 0, 2*Math.PI);
      canvasCtx.fillStyle = '#FFFFFF';
      canvasCtx.fill();
    }
  }
  canvasCtx.restore();
}

const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});

hands.onResults(onResults);

// ВАЖНО: тут указываем заднюю камеру через facingMode
const camera = new Camera(videoElement, {
  onFrame: async () => { await hands.send({image: videoElement}); },
  width: 1280,
  height: 720,
  facingMode: 'environment' // задняя камера вместо передней ('user')
});
camera.start();
</script>
</body>
</html>
